<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>풀림</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/icon48.png" alt="" width="28" height="28">
    <div class="brand"><b>풀림</b><span id="ver" class="muted"></span></div>
    <button id="openOptions" class="icon-btn" title="설정" aria-label="설정">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
    </button>
  </header>

  <section id="siteCard" class="card">
    <div id="host" class="host"></div>

    <div class="row">
      <div class="label">
        <div id="siteTitle" class="title"></div>
        <div id="siteSub" class="sub"></div>
      </div>
      <label class="switch"><input type="checkbox" id="siteToggle"><span></span></label>
    </div>

    <div id="builtinNote" class="note" hidden></div>

    <div id="hintBox" class="hint" hidden>
      <div>이 사이트는 일반 모드로 다 안 풀린 것 같아요.</div>
      <button id="hintStrong" class="btn small warn">강력 모드 켜기</button>
    </div>

    <div class="row" id="strongRow">
      <div class="label">
        <div class="title small">강력 모드</div>
        <div class="sub">그래도 안 될 때만 · 사이트 기능이 이상해지면 끄세요</div>
      </div>
      <label class="switch warn"><input type="checkbox" id="strongToggle"><span></span></label>
    </div>

    <button id="reloadBtn" class="btn wide" hidden>새로고침해서 확실히 적용</button>
  </section>

  <section id="restricted" class="card muted-card" hidden>
    <div class="title small">이 페이지에서는 동작할 수 없어요</div>
    <div class="sub">브라우저 설정 화면, 확장 프로그램 스토어 같은 페이지는 브라우저가 확장 프로그램을 막아 둡니다.</div>
  </section>

  <section class="card plain">
    <div class="row">
      <div class="label"><div class="title small">모든 사이트에서 사용</div></div>
      <label class="switch"><input type="checkbox" id="globalToggle"><span></span></label>
    </div>
    <div class="tip">사이트 자체 우클릭 메뉴가 필요하면 <kbd>Shift</kbd> 를 누른 채 우클릭하세요.</div>
  </section>

  <footer>
    <div id="update" class="update muted">업데이트 확인 중…</div>
    <div class="links">
      <a href="#" id="openGuide">도움말</a>
      <span aria-hidden="true">·</span>
      <a href="#" id="recheck">업데이트 확인</a>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
