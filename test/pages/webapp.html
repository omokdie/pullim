<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>자체 메뉴 웹 앱</title>
<script src="hits.js"></script></head>
<body style="font: 18px sans-serif; margin: 30px">
  <p id="p1">이 앱은 우클릭하면 자체 메뉴를 띄워요</p>
  <div id="menu" hidden style="position: fixed; border: 1px solid #333; background: #fff; padding: 6px">앱 메뉴</div>
  <script>
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault(); __hits.menu++;
      const m = document.getElementById('menu'); m.hidden = false; m.style.left = e.clientX + 'px'; m.style.top = e.clientY + 'px';
    });
  </script>
</body></html>
