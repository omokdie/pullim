<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>출처 붙이는 신문</title>
<script src="hits.js"></script>
<script>
  document.addEventListener('copy', (e) => {
    __hits.copy++;
    e.clipboardData.setData('text/plain', String(getSelection()) + '\n[출처] 막힌 신문 무단전재 금지');
    e.preventDefault();
  });
</script></head>
<body style="font: 18px sans-serif; margin: 30px">
  <p id="p1">기사 본문 한 줄입니다</p>
</body></html>
